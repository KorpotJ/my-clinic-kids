<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8A93A0"/>
    </marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C0546C"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A6FA5"/>
    </marker>
  </defs>

  <rect width="1120" height="830" fill="#FCFBF9"/>

  <!-- ============ CLIENTS ============ -->
  <rect x="60" y="34" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#C0546C" stroke-width="1.6"/>
  <text x="84" y="66" font-size="17" font-weight="bold" fill="#1F2328">Parents</text>
  <text x="84" y="88" font-size="13.5" fill="#5B6472">LINE app · LIFF web view</text>
  <text x="84" y="108" font-size="12" fill="#8A93A0">no install, no separate password</text>

  <rect x="640" y="34" width="420" height="86" rx="10" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="1.6"/>
  <text x="664" y="66" font-size="17" font-weight="bold" fill="#1F2328">Clinic staff</text>
  <text x="664" y="88" font-size="13.5" fill="#5B6472">Browser · Cognito Hosted UI</text>
  <text x="664" y="108" font-size="12" fill="#8A93A0">OAuth2 authorization code · MFA enforced</text>

  <line x1="270" y1="120" x2="270" y2="168" stroke="#C0546C" stroke-width="1.6" marker-end="url(#arR)"/>
  <line x1="850" y1="120" x2="850" y2="168" stroke="#4A6FA5" stroke-width="1.6" marker-end="url(#arB)"/>

  <!-- ============ EDGE ============ -->
  <rect x="60" y="172" width="1000" height="76" rx="10" fill="#FFFFFF" stroke="#D8D5CF" stroke-width="1.4"/>
  <text x="84" y="202" font-size="16" font-weight="bold" fill="#1F2328">CloudFront</text>
  <text x="84" y="224" font-size="13" fill="#5B6472">serves both front ends as static assets</text>
  <rect x="620" y="188" width="420" height="44" rx="7" fill="#F5F7F9" stroke="#DDE1E6"/>
  <text x="640" y="207" font-size="13" font-weight="bold" fill="#3A4250">S3 origin — private</text>
  <text x="640" y="224" font-size="11.5" fill="#7A8494">all 4 public-access blocks on · no bucket policy</text>

  <line x1="560" y1="248" x2="560" y2="290" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ============ API GATEWAY ============ -->
  <rect x="60" y="294" width="1000" height="112" rx="10" fill="#FFFFFF" stroke="#D8D5CF" stroke-width="1.4"/>
  <text x="84" y="322" font-size="16" font-weight="bold" fill="#1F2328">API Gateway — HTTP API</text>
  <text x="330" y="322" font-size="13" fill="#8A93A0">26 routes · every route behind an authorizer</text>

  <rect x="84" y="336" width="460" height="54" rx="7" fill="#FDF4F6" stroke="#E8C3CC"/>
  <text x="102" y="357" font-size="13.5" font-weight="bold" fill="#A8394F">8 routes · LINE token authorizer</text>
  <text x="102" y="376" font-size="11.5" fill="#8A6270">REQUEST type · custom Lambda verifies the LINE ID token</text>

  <rect x="576" y="336" width="460" height="54" rx="7" fill="#F1F5FA" stroke="#C3D2E6"/>
  <text x="594" y="357" font-size="13.5" font-weight="bold" fill="#2F5486">18 routes · Cognito JWT authorizer</text>
  <text x="594" y="376" font-size="11.5" fill="#62748E">plus role check in handler — unknown group returns 403</text>

  <line x1="330" y1="406" x2="330" y2="450" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="820" y1="406" x2="820" y2="450" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ============ LAMBDA ROW ============ -->
  <rect x="60" y="454" width="540" height="66" rx="9" fill="#FFFFFF" stroke="#D8D5CF" stroke-width="1.4"/>
  <text x="84" y="480" font-size="15" font-weight="bold" fill="#1F2328">10 Lambda functions — inside VPC</text>
  <text x="84" y="502" font-size="12" fill="#7A8494">no route to the internet</text>

  <rect x="628" y="454" width="432" height="66" rx="9" fill="#FFFFFF" stroke="#D8D5CF" stroke-width="1.4"/>
  <text x="652" y="480" font-size="15" font-weight="bold" fill="#1F2328">3 Lambda functions — outside VPC</text>
  <text x="652" y="502" font-size="12" fill="#7A8494">need outbound internet access</text>

  <!-- ============ VPC BOX ============ -->
  <rect x="60" y="552" width="540" height="212" rx="12" fill="#F4F7FA" stroke="#9FB0C4" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="82" y="578" font-size="13" font-weight="bold" fill="#4A6079" letter-spacing="0.6">VPC · ap-southeast-7</text>

  <rect x="84" y="592" width="230" height="86" rx="8" fill="#FFFFFF" stroke="#C9D3DF"/>
  <text x="102" y="618" font-size="14.5" font-weight="bold" fill="#1F2328">RDS PostgreSQL 18.3</text>
  <text x="102" y="638" font-size="11.5" fill="#5B6472">private subnet · encrypted</text>
  <text x="102" y="655" font-size="11.5" fill="#5B6472">8 tables · 53 constraints</text>
  <text x="102" y="670" font-size="11" fill="#8A93A0">inbound 5432 from one SG only</text>

  <rect x="346" y="592" width="230" height="86" rx="8" fill="#FFFFFF" stroke="#C9D3DF"/>
  <text x="364" y="618" font-size="14.5" font-weight="bold" fill="#1F2328">VPC endpoints</text>
  <text x="364" y="638" font-size="11.5" fill="#5B6472">Secrets Manager — interface</text>
  <text x="364" y="655" font-size="11.5" fill="#5B6472">S3 — gateway</text>
  <text x="364" y="670" font-size="11" fill="#8A93A0">PrivateLink, never public internet</text>

  <line x1="200" y1="520" x2="200" y2="590" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="460" y1="520" x2="460" y2="590" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="84" y="694" width="492" height="50" rx="8" fill="#FFF7ED" stroke="#E4C99B"/>
  <text x="104" y="716" font-size="13.5" font-weight="bold" fill="#8A6114">No NAT Gateway anywhere in the account</text>
  <text x="104" y="734" font-size="11.5" fill="#95784A">a NAT would have cost more per month than the entire system</text>

  <!-- ============ EXTERNAL ============ -->
  <rect x="628" y="552" width="432" height="212" rx="12" fill="#FAF8F5" stroke="#DCD6CC" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="650" y="578" font-size="13" font-weight="bold" fill="#7A6E5C" letter-spacing="0.6">EXTERNAL SERVICES</text>

  <rect x="652" y="592" width="384" height="66" rx="8" fill="#FFFFFF" stroke="#DCD6CC"/>
  <text x="672" y="618" font-size="14.5" font-weight="bold" fill="#1F2328">LINE Messaging API</text>
  <text x="672" y="640" font-size="11.5" fill="#5B6472">appointment reminders pushed to parents</text>

  <rect x="652" y="674" width="384" height="70" rx="8" fill="#FFFFFF" stroke="#DCD6CC"/>
  <text x="672" y="700" font-size="14.5" font-weight="bold" fill="#1F2328">Cognito Admin API</text>
  <text x="672" y="720" font-size="11.5" fill="#5B6472">staff accounts and roles — no user table in the DB</text>
  <text x="672" y="736" font-size="11" fill="#8A93A0">calls recorded in CloudTrail, used as the audit trail</text>

  <line x1="820" y1="520" x2="820" y2="590" stroke="#8A93A0" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- ============ FOOTER ============ -->
  <text x="60" y="800" font-size="12" fill="#8A93A0">All personal data stays in ap-southeast-7 (Bangkok) · no database credentials in code or environment variables</text>
</svg>
